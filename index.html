      <script>
         /* Popup'lar native HTML Popover API kullanır:
        açma   : <button popovertarget="privacy-popup">
        kapatma: <button popovertarget="privacy-popup" popovertargetaction="hide">

      Esc, top layer (z-index'ten bağımsız üstte durma), aynı anda tek popover
      ve <body> scroll kilidi (reset.css: body:has([popover]:popover-open))
      tarayıcıdan bedava gelir — JS gerekmez.

      Buradaki tek iş: popover tüm ekranı kapladığı için tarayıcının light-dismiss
      davranışı tetiklenmez. Karartılmış zemine tıklamayı biz kapatıyoruz. */
         document.querySelectorAll('[popover][data-popup]').forEach((popup) => {
            popup.addEventListener('click', (event) => {
               if (event.target === popup) popup.hidePopover()
            })
         })
      </script>
